name: Sync match results

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Synchronization mode
        required: true
        default: hourly
        type: choice
        options:
          - hourly
          - daily
          - weekly
          - manual-full
  schedule:
    # JST 07:17-23:17 hourly, plus JST 00:17/03:17/06:17.
    - cron: "17 0-15,18,21-23 * * *"
    # JST 02:37 daily (UTC is the previous calendar day).
    - cron: "37 17 * * *"
    # Sunday JST 04:37 = Saturday UTC 19:37.
    - cron: "37 19 * * 6"

permissions:
  contents: write

concurrency:
  group: sync-match-results
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine synchronization mode
        id: sync-mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_MODE: ${{ inputs.mode }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            mode="$DISPATCH_MODE"
          else
            case "$EVENT_SCHEDULE" in
              "17 0-15,18,21-23 * * *") mode="hourly" ;;
              "37 17 * * *") mode="daily" ;;
              "37 19 * * 6") mode="weekly" ;;
              *) echo "Unknown schedule: $EVENT_SCHEDULE"; exit 1 ;;
            esac
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Synchronization mode: $mode"

      - name: Synchronize official results
        run: npm run update:data:smart -- --mode=${{ steps.sync-mode.outputs.mode }}

      - name: Validate data
        run: npm run validate:data

      - name: Run synchronization regression tests
        run: npx playwright test tests/automatic-sync.spec.js --workers=1

      - name: Run HTTP retry tests
        run: npm run test:sync:http

      - name: Run regular roster difference tests
        run: npm run test:sync:roster

      - name: Run smart synchronization tests
        run: |
          npm run test:sync:smart
          npm run test:poll
          npm run test:sync:selected
          npm run test:audit
          npm run test:roster:selected

      - name: Run player statistics regression tests
        run: npx playwright test tests/player-minutes.spec.js tests/player-season-period.spec.js --workers=1

      - name: Check whitespace errors
        run: git diff --check

      - name: Restore generated data after failure
        if: failure()
        shell: bash
        run: |
          git restore -- \
            data/sync-state.json \
            site/data/players.json \
            site/data/head-to-head.json \
            site/data/seasons/index.json \
            site/data/seasons/2026/matches.json \
            site/data/seasons/2026/team-stats.json \
            site/data/seasons/2026/div2/matches.json \
            site/data/seasons/2026/div2/team-stats.json \
            site/data/seasons/2026/rookie/matches.json \
            site/data/seasons/2026/championship/matches.json \
            site/data/seasons/2026/i-league/div1/matches.json \
            site/data/seasons/2026/i-league/div1/team-stats.json \
            site/data/seasons/2026/i-league/div2/matches.json \
            site/data/seasons/2026/i-league/div2/team-stats.json

      - name: Discard state-only update
        shell: bash
        run: |
          if git diff --quiet -- \
            site/data/players.json \
            site/data/head-to-head.json \
            site/data/seasons/index.json \
            site/data/seasons/2026/matches.json \
            site/data/seasons/2026/team-stats.json \
            site/data/seasons/2026/div2/matches.json \
            site/data/seasons/2026/div2/team-stats.json \
            site/data/seasons/2026/rookie/matches.json \
            site/data/seasons/2026/championship/matches.json \
            site/data/seasons/2026/i-league/div1/matches.json \
            site/data/seasons/2026/i-league/div1/team-stats.json \
            site/data/seasons/2026/i-league/div2/matches.json \
            site/data/seasons/2026/i-league/div2/team-stats.json; then
            echo "試合・集計データに変更がないためsync-stateもコミットしません。"
            git restore -- data/sync-state.json
          fi

      - name: Reject unexpected generated files
        shell: bash
        run: |
          allowed='^(data/sync-state\.json|site/data/(players\.json|head-to-head\.json|seasons/index\.json|seasons/2026/(matches\.json|team-stats\.json|div2/(matches\.json|team-stats\.json)|rookie/matches\.json|championship/matches\.json|i-league/div[12]/(matches\.json|team-stats\.json))))$'
          unexpected="$(git status --porcelain=v1 | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "同期対象外の差分を検出しました:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit changed data
        shell: bash
        run: |
          git add -- \
            data/sync-state.json \
            site/data/players.json \
            site/data/head-to-head.json \
            site/data/seasons/index.json \
            site/data/seasons/2026/matches.json \
            site/data/seasons/2026/team-stats.json \
            site/data/seasons/2026/div2/matches.json \
            site/data/seasons/2026/div2/team-stats.json \
            site/data/seasons/2026/rookie/matches.json \
            site/data/seasons/2026/championship/matches.json \
            site/data/seasons/2026/i-league/div1/matches.json \
            site/data/seasons/2026/i-league/div1/team-stats.json \
            site/data/seasons/2026/i-league/div2/matches.json \
            site/data/seasons/2026/i-league/div2/team-stats.json
          if git diff --cached --quiet; then
            echo "公式データに変更はありません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "試合結果を自動更新"
          git push origin HEAD:main
